<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SS Clan • Набор в клан Rust</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0a0c0f;
            color: #e0e0e0;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Топографический фон */
        .topo-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-color: #0b0d10;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" opacity="0.25"><path d="M0 400 Q100 350 200 380 Q300 410 400 340 Q500 270 600 320 Q700 370 800 290 Q900 210 1000 280 Q1100 350 1200 300 L1200 800 L0 800 Z" fill="none" stroke="%23374151" stroke-width="1.5"/><path d="M0 450 Q150 390 250 430 Q350 470 450 400 Q550 330 650 380 Q750 430 850 360 Q950 290 1050 350 Q1150 410 1200 370 L1200 800 L0 800 Z" fill="none" stroke="%23374151" stroke-width="1.2"/><path d="M0 500 Q120 440 220 480 Q320 520 420 450 Q520 380 620 420 Q720 460 820 390 Q920 320 1020 380 Q1120 440 1200 410 L1200 800 L0 800 Z" fill="none" stroke="%23374151" stroke-width="1"/><path d="M0 550 Q80 500 180 530 Q280 560 380 490 Q480 420 580 460 Q680 500 780 430 Q880 360 980 420 Q1080 480 1200 450 L1200 800 L0 800 Z" fill="none" stroke="%23374151" stroke-width="0.9"/><circle cx="250" cy="380" r="50" fill="none" stroke="%23374151" stroke-width="0.8"/><circle cx="750" cy="320" r="70" fill="none" stroke="%23374151" stroke-width="0.8"/><circle cx="500" cy="420" r="45" fill="none" stroke="%23374151" stroke-width="0.7"/><circle cx="1000" cy="340" r="55" fill="none" stroke="%23374151" stroke-width="0.7"/><path d="M150 600 Q250 550 350 580 Q450 610 550 540 Q650 470 750 510 Q850 550 950 480 Q1050 410 1150 460 L1200 470 L1200 800 L0 800 Z" fill="none" stroke="%23374151" stroke-width="1.1"/></svg>');
            background-repeat: repeat;
            background-size: 800px 600px;
            animation: slowDrift 25s infinite alternate ease-in-out;
        }

        @keyframes slowDrift {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 10% 15%;
            }
        }

        /* Дополнительный слой с текстурой */
        .topo-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at 30% 40%, rgba(30, 40, 55, 0.4) 0%, rgba(5, 7, 10, 0.8) 80%);
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 750px;
            background: rgba(12, 15, 20, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(74, 85, 104, 0.3);
            border-radius: 48px;
            padding: 48px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            display: flex;
            flex-direction: column;
            gap: 42px;
            animation: fadeInUp 0.9s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Заголовок клана */
        .clan-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            text-align: center;
        }

        .clan-icon {
            font-size: 3.8rem;
            filter: drop-shadow(0 8px 15px rgba(0, 160, 255, 0.3));
            animation: pulseGlow 2.2s infinite;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 8px rgba(0, 180, 255, 0.5); }
            50% { text-shadow: 0 0 22px rgba(0, 200, 255, 0.9); }
            100% { text-shadow: 0 0 8px rgba(0, 180, 255, 0.5); }
        }

        .clan-name {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #e5e7eb 0%, #a0aec0 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitle {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 500;
            color: #b9c7dd;
            letter-spacing: 0.3px;
            margin-top: -10px;
        }

        .recruitment-badge {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fecaca;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            margin: 0 auto;
            width: fit-content;
            animation: subtlePulse 2s infinite;
        }

        @keyframes subtlePulse {
            0% { border-color: rgba(220, 38, 38, 0.5); box-shadow: 0 0 8px rgba(220,38,38,0.3); }
            50% { border-color: rgba(255, 70, 70, 0.8); box-shadow: 0 0 18px rgba(255, 50, 50, 0.5); }
            100% { border-color: rgba(220, 38, 38, 0.5); box-shadow: 0 0 8px rgba(220,38,38,0.3); }
        }

        /* Карточки преимуществ и требований */
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .info-card {
            background: rgba(20, 24, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(75, 85, 99, 0.35);
            border-radius: 32px;
            padding: 32px;
            transition: all 0.25s ease;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
        }

        .info-card:hover {
            border-color: rgba(100, 120, 160, 0.7);
            background: rgba(26, 32, 40, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 25px 35px rgba(0, 0, 0, 0.7);
        }

        .card-title {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #f1f5f9;
            letter-spacing: -0.3px;
        }

        .advantage-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.03);
            padding: 18px 22px;
            border-radius: 20px;
            border-left: 5px solid #3b82f6;
        }

        .requirements-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-size: 1.2rem;
        }

        .requirements-list li {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.25);
            padding: 14px 20px;
            border-radius: 18px;
            border: 1px solid rgba(75, 85, 99, 0.3);
            color: #d1d5db;
            font-weight: 500;
        }

        .requirements-list li::before {
            content: "▹";
            color: #f97316;
            font-weight: bold;
            font-size: 1.5rem;
        }

        /* Кнопка Telegram */
        .telegram-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 18px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.3rem;
            text-decoration: none;
            transition: all 0.3s;
            margin-top: 8px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            letter-spacing: 0.4px;
        }

        .telegram-link:hover {
            background: #2563eb;
            border-color: #60a5fa;
            box-shadow: 0 0 28px rgba(37, 99, 235, 0.7);
            transform: scale(1.02);
        }

        .tg-icon {
            font-size: 1.8rem;
        }

        .footer-note {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 10px;
            border-top: 1px solid rgba(75, 85, 99, 0.4);
            padding-top: 22px;
        }

        @media (max-width: 550px) {
            .page {
                padding: 32px 22px;
                border-radius: 36px;
            }
            .clan-name {
                font-size: 2.7rem;
            }
            .advantage-text {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
<div class="topo-bg"></div>
<div class="topo-overlay"></div>

<div class="page">
    <!-- Заголовок клана -->
    <div class="clan-header">
        <span class="clan-icon">🛡️</span>
        <h1 class="clan-name">SS</h1>
    </div>
    <div class="subtitle">Теневой альянс • Rust</div>

    <!-- Бейдж набора -->
    <div class="recruitment-badge">
        ⚡ ОТКРЫТ НАБОР В КЛАН ⚡
    </div>

    <!-- Преимущества -->
    <div class="cards-grid">
        <div class="info-card">
            <div class="card-title">
                <span>🏆</span> Преимущества
            </div>
            <div class="advantage-text">
                Лучший клан для новичков
            </div>
        </div>

        <!-- Требования -->
        <div class="info-card">
            <div class="card-title">
                <span>📋</span> Требования
            </div>
            <ul class="requirements-list">
                <li>От 14 лет</li>
                <li>От 500+ часов</li>
                <li>Требуются: билдеры, фармилы, фермеры, комбатеры и т.п.</li>
            </ul>
        </div>
    </div>

    <!-- Связаться (Telegram) -->
    <a href="https://t.me/Lodarka" target="_blank" rel="noopener noreferrer" class="telegram-link">
        <span class="tg-icon">✈️</span> Связаться в Telegram
        <span style="font-weight: 400; opacity: 0.8; font-size: 1rem;">@Lodarka</span>
    </a>

    <div class="footer-note">
        Присоединяйся к сильнейшим • SS Clan © 2025
    </div>
</div>

<!-- Небольшая интерактивность -->
<script>
    (function() {
        console.log('SS Clan recruitment page ready.');
        // Добавляем небольшую анимацию при клике на ссылку (без отмены перехода)
        const tgLink = document.querySelector('.telegram-link');
        if (tgLink) {
            tgLink.addEventListener('click', function(e) {
                // Просто визуальный эффект, переход сохраняется
                tgLink.style.transform = 'scale(0.96)';
                setTimeout(() => {
                    if (tgLink) tgLink.style.transform = '';
                }, 150);
            });
        }
    })();
</script>
</body>
</html>
